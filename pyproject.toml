[project]
name = "mdq"
version = "0.1.0"
description = "Market data quality and analytics platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "polars>=1.44,<2",
    "pyarrow",
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "python-multipart",
    "httpx",
    "streamlit",
    "plotly",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "hypothesis",
    "ruff",
    "mypy",
    "huggingface_hub",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mdq"]

# --------------------------------------------------------------------------- #
# ruff
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # comprehensions
    "SIM",  # flake8-simplify
    "PTH",  # use pathlib
    "ARG",  # unused arguments
    "TID",  # tidy imports
    "RUF",
]
ignore = [
    "B008",  # function call in default argument (FastAPI idiom)
]

# Prose in docstrings uses en dashes deliberately.
allowed-confusables = ["–", "—", "’"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001", "ARG002"]

[tool.ruff.lint.isort]
known-first-party = ["mdq"]

[tool.ruff.format]
# Illustrative snippets in the docs are written for a reader, not for the compiler:
# they use `...` bodies and trailing explanatory comments that the formatter would
# collapse onto one line. Prose is not code we ship, so the formatter leaves it alone.
exclude = ["*.md"]

# --------------------------------------------------------------------------- #
# mypy
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.12"
files = ["src/mdq"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["^src/mdq/dashboard/"]

[[tool.mypy.overrides]]
module = "mdq.dashboard.*"
ignore_errors = true

# --------------------------------------------------------------------------- #
# pytest
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
testpaths = ["tests"]
# `support` (the synthetic builder / fault harness) and `fetch_data` are importable
# by name from any test without sys.path games.
pythonpath = ["tests", "scripts"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "unit: fast, isolated tests on synthetic data",
    "property: hypothesis property-based tests",
    "golden: tests asserting against committed real data / vendor diagnostics",
    "integration: end-to-end tests across layers (API, dashboard)",
    "slow: tests that take more than a second",
]

# --------------------------------------------------------------------------- #
# coverage
# --------------------------------------------------------------------------- #
[tool.coverage.run]
branch = false
source = ["src/mdq"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
